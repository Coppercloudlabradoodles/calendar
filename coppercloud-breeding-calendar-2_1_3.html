<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coppercloud Labradoodles — Breeding Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FAF7F2;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --rule: #D8D2C4;
    --rule-strong: #C4BCA9;
    --today-ring: #2B2620;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height:100%;
    overflow: hidden;
  }

  .stage{
    width:100vw;
    height:100vh;
    padding: 0.8vh 1.6vw 0.6vh 1.6vw;
    display:flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 0.5vh;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 0.4vh;
    flex-shrink:0;
    gap: 1vw;
  }
  .title-block h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 1.8vw;
    line-height: 1;
    margin:0;
    letter-spacing: -0.01em;
  }
  .title-block .sub{
    display:inline-block;
    margin-right: 0.8vw;
    font-size: 0.95vw;
    color: var(--ink-soft);
    margin-top: 0.3vh;
    font-weight: 500;
  }

  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 0.3vw 0.9vw;
    justify-content: flex-end;
    max-width: 70%;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap: 0.4vw;
    font-size: 0.68vw;
    font-weight: 600;
    white-space: nowrap;
  }
  .legend-swatch{
    width: 0.7vw;
    height: 0.7vw;
    border-radius: 2px;
    flex-shrink:0;
  }

  .status-pill{
    font-size: 0.62vw;
    color: var(--ink-soft);
    font-weight: 500;
    padding: 0.25vh 0.55vw;
    border: 1px solid var(--rule-strong);
    border-radius: 100px;
    white-space:nowrap;
    display:inline-block;
    margin-top: 0.4vh;
  }
  .status-pill.live{ color: #2F6F4F; border-color: #2F6F4F; }
  .status-pill.error{ color: #B23A3A; border-color: #B23A3A; }

  /* ---------- Status strip ---------- */
  .status-strip{
    flex-shrink:0;
    display:flex;
    gap: 0.5vw;
    overflow-x:auto;
    padding-bottom: 0.6vh;
    margin-bottom: 0.5vh;
    border-bottom: 1px solid var(--rule);
  }
  .status-chip{
    display:flex;
    align-items:center;
    gap: 0.35vw;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 0.4vh 0.7vw;
    font-size: 0.66vw;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink:0;
  }
  .status-chip .dot{
    width: 0.5vw;
    height: 0.5vw;
    border-radius:50%;
    flex-shrink:0;
  }
  .status-chip .chip-detail{
    color: var(--ink-soft);
    font-weight:500;
  }
  .status-empty{
    font-size: 0.7vw;
    color: var(--ink-soft);
    font-style: italic;
    align-self:center;
  }

  /* ---------- Grid of months ---------- */
  .year-grid{
    flex:1;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 1vh 1vw;
    min-height:0;
  }

  .month-card{
    background: white;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 0.7vh 0.8vw 0.6vh 0.8vw;
    display:flex;
    flex-direction: column;
    min-height:0;
    min-width:0;
  }

  .month-name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.25vw;
    margin-bottom: 0.2vh;
    flex-shrink:0;
  }

  .dow-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    flex-shrink:0;
    margin-bottom: 0.15vh;
  }
  .dow-row span{
    font-size: 0.78vw;
    color: var(--ink-soft);
    font-weight: 600;
    text-align:center;
  }

  .calendar-body{
    position: relative;
    flex:1;
    min-height:0;
  }

  .day-grid, .events-layer{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    position:absolute;
    inset:0;
  }

  .day-cell{
    position:relative;
    border-radius: 3px;
    background: var(--cream);
  }
  .day-cell.empty{ background: transparent; }

  .day-num{
    position:absolute;
    top: 1px; left: 2px;
    font-size: 0.7vw;
    color: var(--ink-soft);
    font-weight: 600;
    line-height:1;
    z-index: 5;
    padding: 0.12vw 0.2vw;
  }
  .day-cell.is-today .day-num{
    color: white;
    background: var(--today-ring);
    border-radius: 50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 0.92vw;
    height: 0.92vw;
    padding: 0;
    font-size: 0.64vw;
    font-weight:700;
  }

  .events-layer{
    pointer-events:none;
  }
  .ev-block{
    display:flex;
    align-items:center;
    min-height:0;
    height:100%;
    margin: 0.5px 0;
    border-radius: 3px;
    font-size: 0.58vw;
    font-weight: 700;
    color: white;
    padding: 0 0.3vw;
    overflow: hidden;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
  }
  .ev-block > span{
    display:block;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    line-height:1;
  }
  /* single-day events: solid on their exact day, lighter tint where the label spills over */
  .ev-spill-right{ background-image: linear-gradient(to right, transparent 50%, rgba(255,255,255,0.3) 50%); }
  .ev-spill-left{ background-image: linear-gradient(to left, transparent 50%, rgba(255,255,255,0.3) 50%); }
  .ev-spill-left > span{ text-align:right; }
  .overflow-note{
    font-family: 'Inter', sans-serif;
    font-size: 0.75vw;
    font-weight: 600;
    color: var(--ink-soft);
    margin-left: 0.6vw;
    cursor: default;
  }

  footer{
    flex-shrink:0;
    text-align:center;
    padding-top: 0.2vh;
    font-size: 0.6vw;
    color: var(--ink-soft);
  }

  @media (max-width: 900px){
    .stage{ overflow: auto; height:auto; }
    .year-grid{ grid-template-columns: repeat(2,1fr); grid-template-rows: repeat(6,minmax(220px,1fr)); }
    .title-block h1{ font-size: 5vw; }
    .legend{ display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="title-block">
      <h1>Coppercloud Labradoodles</h1>
      <div class="sub" id="yearLabel">2026 Breeding Calendar</div>
      <div class="status-pill" id="statusPill">Loading calendar…</div>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="status-strip" id="statusStrip"></div>

  <div class="year-grid" id="yearGrid"></div>

  <footer id="footerNote">Showing sample data — connect your Google Calendar to see live dates.</footer>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const ICAL_URL = "https://calendar.google.com/calendar/ical/d70399a2996c3e6a38e41b10ce8978770b00d67fdc81c179d85751163730e7fb%40group.calendar.google.com/private-d888b8d67af6ba892fbae8c11dd0eac5/basic.ics";

// Reliable relay hosted on Cloudflare Workers — fetches the calendar
// server-side and returns it with proper CORS headers. This is the
// primary source; public proxies below are kept only as a last-resort
// fallback in case the relay itself is ever down.
const RELAY_URL = "https://coppercloud-relay.coppercloudholdings.workers.dev/";

const CORS_PROXIES = [
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://corsproxy.io/?url=" + encodeURIComponent(url),
  url => "https://thingproxy.freeboard.io/fetch/" + url,
];

const YEAR = new Date().getFullYear();

/* ============================================================
   EVENT TYPE TAXONOMY — matches Casey's Google Calendar labels.
   Order matters: first matching pattern wins, so more specific
   patterns (mom goes home) are checked before broader ones.
   ============================================================ */
const TYPES = [
  { key: "honeymoon", label: "Honeymoon",           color: "#C2185B", re: /honeymoon|breeding window/i },
  { key: "tie",        label: "Tie",                 color: "#3B4B8C", re: /\btie\b/i },
  { key: "heat",       label: "Heat",                color: "#B23A3A", re: /heat|cycle/i },
  { key: "due",        label: "Due Date",            color: "#C97A2C", re: /\bdue\b/i },
  { key: "birth",      label: "Birth",               color: "#2F6F4F", re: /\b(birth|born|whelp\w*)\b/i },
  { key: "vet",        label: "Vet / Testing",       color: "#2E6DA4", re: /\bvet\b|testing|\bdna\b|\bofa\b/i },
  { key: "business",   label: "Business",            color: "#B8960C", re: /business|registration/i },
  { key: "momhome",    label: "Mom Goes Home",       color: "#7B4FA0", re: /mom.*home|dam.*home|mom goes home/i },
  { key: "gohome",     label: "Puppy Go-Home Date",  color: "#8E2A8E", re: /go[\s-]?home/i },
  { key: "puppies",    label: "Puppies in House",    color: "#616161", re: /puppies|puppy in house|in[\s-]?house/i },
];

function findType(title){
  return TYPES.find(t => t.re.test(title));
}
function typeInfo(key){
  return TYPES.find(t => t.key === key) || { label: key, color: "#888" };
}

/* ============================================================
   SAMPLE DATA
   ============================================================ */
const SAMPLE_EVENTS = [
  { title: "Bella - Heat", type: "heat", start: `${YEAR}-01-14` },
  { title: "Bella - Tie", type: "tie", start: `${YEAR}-01-16` },
  { title: "Bella - Due Date", type: "due", start: `${YEAR}-03-18` },
  { title: "Bella - Birth", type: "birth", start: `${YEAR}-03-18` },
  { title: "Bella's Litter - Puppies in House", type: "puppies", start: `${YEAR}-03-18`, end: `${YEAR}-05-13` },
  { title: "Bella's Litter - Puppy Go-Home Date", type: "gohome", start: `${YEAR}-05-13` },

  { title: "Daisy - Honeymoon", type: "honeymoon", start: `${YEAR}-01-30`, end: `${YEAR}-02-05` },
  { title: "Daisy - Heat", type: "heat", start: `${YEAR}-02-02` },
  { title: "Daisy - Due Date", type: "due", start: `${YEAR}-04-07` },
  { title: "Daisy's Litter - Puppies in House", type: "puppies", start: `${YEAR}-04-07`, end: `${YEAR}-06-02` },
  { title: "Daisy - Mom Goes Home", type: "momhome", start: `${YEAR}-04-09` },
  { title: "Daisy's Litter - Puppy Go-Home Date", type: "gohome", start: `${YEAR}-06-02` },

  { title: "Luna - Vet/Testing", type: "vet", start: `${YEAR}-03-10` },
  { title: "Luna - Heat", type: "heat", start: `${YEAR}-03-28` },
  { title: "Luna - Due Date", type: "due", start: `${YEAR}-06-01` },
  { title: "Luna's Litter - Puppies in House", type: "puppies", start: `${YEAR}-06-01`, end: `${YEAR}-07-27` },
  { title: "Luna's Litter - Puppy Go-Home Date", type: "gohome", start: `${YEAR}-07-27` },

  { title: "Rosie - Heat", type: "heat", start: `${YEAR}-05-10` },
  { title: "Rosie - Due Date", type: "due", start: `${YEAR}-07-14` },
  { title: "Rosie's Litter - Puppies in House", type: "puppies", start: `${YEAR}-07-14`, end: `${YEAR}-09-08` },
  { title: "Rosie's Litter - Puppy Go-Home Date", type: "gohome", start: `${YEAR}-09-08` },

  { title: "Business - AKC Registration", type: "business", start: `${YEAR}-08-01` },

  { title: "Willow - Heat", type: "heat", start: `${YEAR}-07-20` },
  { title: "Willow - Due Date", type: "due", start: `${YEAR}-09-23` },
  { title: "Willow's Litter - Puppies in House", type: "puppies", start: `${YEAR}-09-23`, end: `${YEAR}-11-18` },
  { title: "Willow's Litter - Puppy Go-Home Date", type: "gohome", start: `${YEAR}-11-18` },

  { title: "Maple - Heat", type: "heat", start: `${YEAR}-09-05` },
  { title: "Maple - Due Date", type: "due", start: `${YEAR}-11-09` },
  { title: "Maple's Litter - Puppies in House", type: "puppies", start: `${YEAR}-11-09`, end: `${YEAR+1}-01-04` },
];

/* ============================================================
   Date helpers
   ============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseYMD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function dayDiff(a,b){ return Math.round((b-a)/(1000*60*60*24)); }

function extractName(title){
  const splitMatch = title.match(/^(.*?)\s*[-\u2014:]\s*(.+)$/);
  if (splitMatch && splitMatch[1].trim()) {
    return splitMatch[1].trim();
  }
  return title;
}

// Assigns each event a vertical "lane" so overlapping events (e.g. two
// dogs' Puppies-in-House windows over the same days) stack into separate
// rows instead of rendering on top of each other and hiding one another.
// This is the same technique real calendar apps use for day/week views.
function assignLanes(events, rangeStart, rangeEnd){
  const DAY = 24*60*60*1000;
  const clipped = events.map(e => {
    const cs = e.startD < rangeStart ? rangeStart : e.startD;
    const ce = e.endD > rangeEnd ? rangeEnd : e.endD;
    const single = e.startD.getTime() === e.endD.getTime();
    // Single-day events spill their label into an adjacent day cell (right,
    // or left if they land on a Saturday), so reserve that space in the lane.
    let os = cs, oe = ce;
    if (single) {
      if (cs.getDay() === 6) os = new Date(cs.getTime() - DAY);
      else oe = new Date(ce.getTime() + DAY);
    }
    return { ...e, cs, ce, os, oe, single };
  });
  clipped.sort((a, b) => a.os - b.os || (a.oe - a.os) - (b.oe - b.os));

  const laneEnds = [];
  clipped.forEach(e => {
    let placed = false;
    for (let i = 0; i < laneEnds.length; i++) {
      if (laneEnds[i] < e.os) {
        e.lane = i;
        laneEnds[i] = e.oe;
        placed = true;
        break;
      }
    }
    if (!placed) {
      e.lane = laneEnds.length;
      laneEnds.push(e.oe);
    }
  });

  return { events: clipped, laneCount: Math.max(laneEnds.length, 1) };
}

/* ============================================================
   Legend (built dynamically from TYPES)
   ============================================================ */
function buildLegend(){
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  TYPES.forEach(t => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const sw = document.createElement('span');
    sw.className = 'legend-swatch';
    sw.style.background = t.color;
    item.appendChild(sw);
    const label = document.createElement('span');
    label.textContent = t.label;
    item.appendChild(label);
    legend.appendChild(item);
  });
}

/* ============================================================
   Status strip: "Happening Now" + "Coming Up"
   ============================================================ */
function buildStatusStrip(events){
  const strip = document.getElementById('statusStrip');
  strip.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);

  const enriched = events.map(ev => {
    const start = parseYMD(ev.start);
    const end = ev.end ? parseYMD(ev.end) : start;
    return { ...ev, startD: start, endD: end, name: extractName(ev.title) };
  });

  const active = enriched.filter(e => e.startD <= today && today <= e.endD)
    .sort((a,b) => a.startD - b.startD);
  const upcoming = enriched.filter(e => e.startD > today)
    .sort((a,b) => a.startD - b.startD)
    .slice(0, 12);

  if (active.length === 0 && upcoming.length === 0) {
    strip.innerHTML = '<div class="status-empty">No upcoming events found.</div>';
    return;
  }

  active.forEach(e => {
    const totalDays = dayDiff(e.startD, e.endD) + 1;
    const elapsed = dayDiff(e.startD, today) + 1;
    const detail = e.endD > e.startD ? `Day ${elapsed} of ${totalDays}` : 'Today';
    strip.appendChild(makeChip(e, detail));
  });

  upcoming.forEach(e => {
    const inDays = dayDiff(today, e.startD);
    const detail = inDays === 1 ? 'Tomorrow' : `in ${inDays}d`;
    strip.appendChild(makeChip(e, detail));
  });
}

function makeChip(e, detail){
  const info = typeInfo(e.type);
  const chip = document.createElement('div');
  chip.className = 'status-chip';
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = info.color;
  chip.appendChild(dot);
  const text = document.createElement('span');
  text.textContent = `${e.name} - ${info.label}`;
  chip.appendChild(text);
  const det = document.createElement('span');
  det.className = 'chip-detail';
  det.textContent = detail;
  chip.appendChild(det);
  return chip;
}

/* ============================================================
   Build the 12-month grid with spanning named bars
   ============================================================ */
const MONTHS_SHOWN = 6; // rolling window: this month + next 5
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function buildYearGrid(events){
  const grid = document.getElementById('yearGrid');
  grid.innerHTML = '';

  const now = new Date();
  const startYear = now.getFullYear();
  const startMonth = now.getMonth();

  // MONTHS_SHOWN (year, month) pairs starting this month, rolling forward —
  // so the window always shows "now through the next few months" rather than
  // a fixed calendar year that goes stale as time passes.
  const monthList = [];
  for (let i = 0; i < MONTHS_SHOWN; i++) {
    const totalM = startMonth + i;
    monthList.push({ year: startYear + Math.floor(totalM / 12), month: totalM % 12 });
  }

  document.getElementById('yearLabel').textContent =
    `${MONTH_NAMES[monthList[0].month]} ${monthList[0].year} – ${MONTH_NAMES[monthList[MONTHS_SHOWN - 1].month]} ${monthList[MONTHS_SHOWN - 1].year}`;

  const enriched = events.map(ev => {
    const start = parseYMD(ev.start);
    const end = ev.end ? parseYMD(ev.end) : start;
    return { ...ev, startD: start, endD: end, name: extractName(ev.title) };
  });

  const todayKey = ymd(new Date());

  monthList.forEach(({ year: y, month: m }) => {
    const monthStart = new Date(y, m, 1);
    const monthEnd = new Date(y, m + 1, 0);
    const firstDow = monthStart.getDay();
    const totalDays = daysInMonth(y, m);
    const numRows = Math.ceil((firstDow + totalDays) / 7);

    const card = document.createElement('div');
    card.className = 'month-card';

    const name = document.createElement('div');
    name.className = 'month-name';
    name.textContent = `${MONTH_NAMES[m]} ${y}`;
    card.appendChild(name);

    const dowRow = document.createElement('div');
    dowRow.className = 'dow-row';
    ['S','M','T','W','T','F','S'].forEach(d => {
      const s = document.createElement('span');
      s.textContent = d;
      dowRow.appendChild(s);
    });
    card.appendChild(dowRow);

    const body = document.createElement('div');
    body.className = 'calendar-body';

    const dayGrid = document.createElement('div');
    dayGrid.className = 'day-grid';
    dayGrid.style.gridTemplateRows = `repeat(${numRows}, 1fr)`;

    for (let i = 0; i < firstDow; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell empty';
      dayGrid.appendChild(cell);
    }
    for (let d = 1; d <= totalDays; d++) {
      const cell = document.createElement('div');
      const key = `${y}-${pad(m+1)}-${pad(d)}`;
      cell.className = 'day-cell' + (key === todayKey ? ' is-today' : '');
      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);
      dayGrid.appendChild(cell);
    }
    body.appendChild(dayGrid);

    const eventsLayer = document.createElement('div');
    eventsLayer.className = 'events-layer';

    const monthEvents = enriched.filter(e => e.startD <= monthEnd && e.endD >= monthStart);
    const { events: lanedEvents, laneCount: actualLaneCount } = assignLanes(monthEvents, monthStart, monthEnd);

    // 6-week months are shorter per week, so show one fewer lane there
    const MAX_LANES = numRows >= 6 ? 4 : 5;
    // each week = one fixed row reserved for the day numbers + MAX_LANES event lanes
    const weekTracks = `0.95vw ${'1fr '.repeat(MAX_LANES)}`.trim();
    eventsLayer.style.gridTemplateRows = Array(numRows).fill(weekTracks).join(' ');

    const hiddenNames = new Set();

    lanedEvents.forEach(e => {
      if (e.lane >= MAX_LANES) {
        hiddenNames.add(`${e.name} - ${typeInfo(e.type).label}`);
        return;
      }
      const info = typeInfo(e.type);
      const clipStart = e.cs;
      const clipEnd = e.ce;

      let cur = new Date(clipStart);
      while (cur <= clipEnd) {
        const dayIndexInMonth = cur.getDate();
        const cellIndex = firstDow + dayIndexInMonth - 1;
        const weekRow = Math.floor(cellIndex / 7);
        const colStart = cellIndex % 7;

        let segDays = 1;
        let nextCol = colStart + 1;
        let peek = new Date(cur);
        while (nextCol < 7) {
          peek.setDate(peek.getDate() + 1);
          if (peek > clipEnd) break;
          segDays++;
          nextCol++;
        }

        const block = document.createElement('div');
        block.className = 'ev-block';
        block.style.background = info.color;
        block.style.gridRow = (weekRow * (MAX_LANES + 1)) + e.lane + 2;
        let colSpan = segDays, colFrom = colStart + 1;
        if (e.single && segDays === 1) {
          if (colStart < 6) { colSpan = 2; block.classList.add('ev-spill-right'); }
          else { colFrom = colStart; colSpan = 2; block.classList.add('ev-spill-left'); }
        }
        block.style.gridColumn = colFrom + ' / span ' + colSpan;
        const label = document.createElement('span');
        label.textContent = `${e.name} - ${info.label}`;
        block.appendChild(label);
        eventsLayer.appendChild(block);

        cur.setDate(cur.getDate() + segDays);
      }
    });

    if (hiddenNames.size > 0) {
      const overflow = document.createElement('span');
      overflow.className = 'overflow-note';
      overflow.textContent = `+${hiddenNames.size} more`;
      overflow.title = Array.from(hiddenNames).join(', ');
      name.appendChild(overflow);
    }

    body.appendChild(eventsLayer);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

/* ============================================================
   Minimal iCal parser
   ============================================================ */
function parseICS(text) {
  const events = [];
  const lines = text.split(/\r\n|\n|\r/);
  const unfolded = [];
  for (const line of lines) {
    if (line.startsWith(' ') && unfolded.length) {
      unfolded[unfolded.length - 1] += line.slice(1);
    } else {
      unfolded.push(line);
    }
  }

  let cur = null;
  for (const line of unfolded) {
    if (line === 'BEGIN:VEVENT') { cur = {}; continue; }
    if (line === 'END:VEVENT') {
      if (cur && cur.summary && cur.start) {
        const matched = findType(cur.summary);
        if (matched) {
          events.push({
            title: cur.summary,
            type: matched.key,
            start: cur.start,
            end: cur.end && cur.end !== cur.start ? cur.end : undefined
          });
        }
      }
      cur = null;
      continue;
    }
    if (!cur) continue;

    const idx = line.indexOf(':');
    if (idx === -1) continue;
    const rawKey = line.slice(0, idx);
    const value = line.slice(idx + 1);
    const key = rawKey.split(';')[0];

    if (key === 'SUMMARY') cur.summary = value.replace(/\\,/g, ',').replace(/\\;/g,';');
    if (key === 'DTSTART') cur.start = icsDateToYMD(value);
    if (key === 'DTEND') {
      const end = icsDateToYMD(value);
      if (end) {
        const d = parseYMD(end);
        d.setDate(d.getDate() - 1);
        cur.end = ymd(d);
      }
    }
  }
  return events;
}

function icsDateToYMD(v) {
  const m = v.match(/^(\d{4})(\d{2})(\d{2})/);
  if (!m) return null;
  return `${m[1]}-${m[2]}-${m[3]}`;
}

/* ============================================================
   Fetch + init
   ============================================================ */
function renderEvents(events){
  buildYearGrid(events);
  buildStatusStrip(events);
}

async function loadCalendar() {
  const pill = document.getElementById('statusPill');
  const footer = document.getElementById('footerNote');

  buildLegend();

  if (!ICAL_URL) {
    renderEvents(SAMPLE_EVENTS);
    pill.textContent = 'Sample data';
    return;
  }

  pill.textContent = 'Loading calendar…';

  const attempts = [
    RELAY_URL,
    ICAL_URL,
    ...CORS_PROXIES.map(fn => fn(ICAL_URL))
  ];

  for (const url of attempts) {
    try {
      pill.textContent = 'Loading calendar… (trying connection)';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (!text.includes('BEGIN:VCALENDAR')) throw new Error('Not a valid iCal feed');

      const events = parseICS(text);
      console.log('Fetched via:', url);
      console.log('Raw events found in feed (before keyword filter):', (text.match(/BEGIN:VEVENT/g) || []).length);
      console.log('Events matched to a tracked category:', events);

      if (events.length === 0) {
        renderEvents(SAMPLE_EVENTS);
        pill.textContent = 'Connected — no matching events found';
        pill.className = 'status-pill error';
        footer.textContent = 'Calendar connected, but no events matched a tracked category keyword in titles.';
        return;
      }

      renderEvents(events);
      pill.textContent = 'Live — synced with Google Calendar';
      pill.className = 'status-pill live';
      footer.textContent = `Last synced ${new Date().toLocaleString()} · refreshes automatically every 15 minutes`;
      return;
    } catch (err) {
      console.warn('Fetch attempt failed for', url, err);
      continue;
    }
  }

  renderEvents(SAMPLE_EVENTS);
  pill.textContent = 'Showing sample data — connection failed';
  pill.className = 'status-pill error';
  footer.textContent = 'Could not reach Google Calendar from this browser. See notes below the dashboard for fixes.';
}

loadCalendar();
setInterval(loadCalendar, 15 * 60 * 1000);
</script>
